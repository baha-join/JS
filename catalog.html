<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог игр - GAMING STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-gamepad me-2"></i>
                <strong>GAMING STORE</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Главная</a>
                    <a class="nav-link active" href="catalog.html">Каталог</a>
                    <a class="nav-link" href="sellers.html">Продавцы</a>
                    <a class="nav-link" href="new-games.html">Новинки</a>
                    <a class="nav-link" href="sale.html">Распродажа</a>
                </div>
                <div class="d-flex align-items-center">
                    <form class="d-flex me-3" id="search-form">
                        <input class="form-control me-2" type="search" id="search-input" placeholder="Поиск игр...">
                        <button class="btn btn-outline-light" type="submit"><i class="fas fa-search"></i></button>
                    </form>
                    <a href="cart.html" class="btn btn-outline-light me-2 position-relative">
                        <i class="fas fa-shopping-cart"></i> Корзина
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">0</span>
                    </a>
                    <div id="auth-buttons">
                        <a href="login.html" class="btn btn-outline-light">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container py-4">
            <h1 class="mb-4">Каталог игр</h1>
            
            <!-- Фильтры -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <form id="filter-form" class="row g-2">
                        <div class="col-md-5">
                            <select id="genre-filter" class="form-select">
                                <option value="">Все жанры</option>
                                <option value="RPG">RPG</option>
                                <option value="Шутер">Шутер</option>
                                <option value="Приключения">Приключения</option>
                                <option value="Стратегия">Стратегия</option>
                                <option value="Симулятор">Симулятор</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <select id="platform-filter" class="form-select">
                                <option value="">Все платформы</option>
                                <option value="PC">PC</option>
                                <option value="PlayStation">PlayStation</option>
                                <option value="Xbox">Xbox</option>
                                <option value="Nintendo">Nintendo</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="button" id="apply-filters" class="btn btn-primary w-100">Фильтр</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Список игр -->
            <div class="row" id="games-container">
                <!-- JS загрузит игры -->
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2025 GAMING STORE. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
