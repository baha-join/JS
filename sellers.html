<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продавцы - GAMING STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">GAMING STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Главная</a>
                    <a class="nav-link" href="catalog.html">Каталог</a>
                    <a class="nav-link active" href="sellers.html">Продавцы</a>
                </div>
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="btn btn-outline-light me-2">
                        <i class="fas fa-shopping-cart"></i> Корзина
                    </a>
                    <div id="auth-buttons"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container py-4">
            <h1 class="mb-4">Все продавцы</h1>
            <div class="row" id="sellers-container"></div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2025 GAMING STORE. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function getUniqueSellers() {
            const games = loadGames();
            const sellersMap = new Map();
            games.forEach(game => {
                if (!sellersMap.has(game.seller.id)) {
                    sellersMap.set(game.seller.id, game.seller);
                }
            });
            return Array.from(sellersMap.values());
        }
        
        function displaySellers() {
            const sellers = getUniqueSellers();
            const container = document.getElementById('sellers-container');
            
            container.innerHTML = sellers.map(seller => `
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">${seller.login}</h5>
                            <p class="card-text">Рейтинг: ${seller.rating}</p>
                            <a href="seller-detail.html?id=${seller.id}" class="btn btn-primary">Смотреть игры</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            displaySellers();
            cart.updateCartCount();
        });
    </script>
</body>
</html>
