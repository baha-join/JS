<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продавец - GAMING STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">GAMING STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Главная</a>
                    <a class="nav-link" href="catalog.html">Каталог</a>
                    <a class="nav-link" href="sellers.html">Продавцы</a>
                </div>
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="btn btn-outline-light me-2">
                        <i class="fas fa-shopping-cart"></i> Корзина
                    </a>
                    <div id="auth-buttons"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container py-4" id="seller-detail-container"></div>
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2025 GAMING STORE. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function getSellerIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return parseInt(params.get('id'));
        }
        
        function displaySellerDetail() {
            const sellerId = getSellerIdFromUrl();
            const container = document.getElementById('seller-detail-container');
            const games = loadGames();
            const sellerGames = games.filter(g => g.seller.id === sellerId);
            const seller = sellerGames[0]?.seller;
            
            if (!seller) {
                container.innerHTML = '<div class="alert alert-danger">Продавец не найден</div>';
                return;
            }
            
            container.innerHTML = `
                <h1>Продавец: ${seller.login}</h1>
                <p><strong>Рейтинг: ${seller.rating}</strong></p>
                
                <h3 class="mt-4">Игры продавца</h3>
                <div class="row">
                    ${sellerGames.map(game => `
                        <div class="col-md-4 mb-4">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">${game.title}</h5>
                                    <p class="card-text">${game.genre}</p>
                                    <p class="card-text">${game.description.substring(0, 100)}...</p>
                                    <p><strong>${game.price} RUB</strong></p>
                                    <button class="btn btn-primary add-to-cart" data-game-id="${game.id}">В корзину</button>
                                    <a href="game-detail.html?id=${game.id}" class="btn btn-outline-secondary">Подробнее</a>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', () => {
                    const gameId = parseInt(btn.dataset.gameId);
                    const game = games.find(g => g.id === gameId);
                    cart.addItem(game);
                });
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            displaySellerDetail();
            cart.updateCartCount();
        });
    </script>
</body>
</html>
