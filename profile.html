<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - GAMING STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-gamepad me-2"></i>
                <strong>GAMING STORE</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Главная</a>
                    <a class="nav-link" href="catalog.html">Каталог</a>
                    <a class="nav-link" href="sellers.html">Продавцы</a>
                </div>
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="btn btn-outline-light me-2">
                        <i class="fas fa-shopping-cart"></i> Корзина
                    </a>
                    <div id="auth-buttons"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container py-4">
            <div id="profile-content"></div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2025 GAMING STORE. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function displayProfile() {
            const container = document.getElementById('profile-content');
            const user = auth.currentUser;
            
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            container.innerHTML = `
                <div class="row">
                    <div class="col-md-4">
                        <div class="card game-card">
                            <div class="card-body text-center">
                                <div class="mb-3">
                                    <i class="fas fa-user-circle fa-5x text-primary"></i>
                                </div>
                                <h4>${user.username}</h4>
                                <p class="text-muted">${user.email}</p>
                                <p class="text-success">
                                    <i class="fas fa-star me-1"></i>
                                    Участник с ${new Date(user.date_joined).toLocaleDateString()}
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-8">
                        <div class="card game-card">
                            <div class="card-body">
                                <h4 class="card-title">Личная информация</h4>
                                <form>
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Имя пользователя</label>
                                            <input type="text" class="form-control" value="${user.username}" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" value="${user.email}" readonly>
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-primary" onclick="alert('Функция редактирования в разработке')">
                                        Редактировать профиль
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            displayProfile();
            cart.updateCartCount();
        });
    </script>
</body>
</html>
