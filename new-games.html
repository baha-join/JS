<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новинки - GAMING STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">GAMING STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Главная</a>
                    <a class="nav-link" href="catalog.html">Каталог</a>
                    <a class="nav-link" href="sellers.html">Продавцы</a>
                    <a class="nav-link active" href="new-games.html">Новинки</a>
                    <a class="nav-link" href="sale.html">Распродажа</a>
                </div>
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="btn btn-outline-light me-2">
                        <i class="fas fa-shopping-cart"></i> Корзина
                    </a>
                    <div id="auth-buttons"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container mt-4">
            <h1 class="mb-4">Новые игры</h1>
            <div class="row" id="new-games-container"></div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2025 GAMING STORE. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function displayNewGames() {
            const games = loadGames();
            const newGames = games.sort((a, b) => new Date(b.release_date) - new Date(a.release_date)).slice(0, 6);
            const container = document.getElementById('new-games-container');
            
            container.innerHTML = newGames.map(game => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">${game.title}</h5>
                            <p class="card-text">${game.description.substring(0, 100)}...</p>
                            <p class="text-success"><strong>${game.price} RUB</strong></p>
                            <span class="badge bg-danger mb-2">НОВИНКА</span>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-primary btn-sm add-to-cart" data-game-id="${game.id}">В корзину</button>
                            <a href="game-detail.html?id=${game.id}" class="btn btn-outline-secondary btn-sm">Подробнее</a>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', () => {
                    const gameId = parseInt(btn.dataset.gameId);
                    const game = games.find(g => g.id === gameId);
                    cart.addItem(game);
                });
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            displayNewGames();
            cart.updateCartCount();
        });
    </script>
</body>
</html>
