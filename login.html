<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - GAMING STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4">Вход в систему</h2>
                        
                        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
                        
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required 
                                       placeholder="admin@example.com">
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password" required 
                                       placeholder="admin123">
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-4">Войти</button>
                            
                            <div class="text-center">
                                <small class="text-muted">
                                    Нет аккаунта? <a href="register.html" class="text-decoration-none">Зарегистрироваться</a>
                                </small>
                                <br>
                                <small class="text-muted">
                                    Демо-аккаунт: admin@example.com / admin123
                                </small>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const result = auth.login(email, password);
            
            if (result.success) {
                window.location.href = 'index.html';
            } else {
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = result.error || 'Неверный email или пароль';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
