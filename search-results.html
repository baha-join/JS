<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты поиска - GAMING STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">GAMING STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Главная</a>
                    <a class="nav-link" href="catalog.html">Каталог</a>
                    <a class="nav-link" href="sellers.html">Продавцы</a>
                </div>
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="btn btn-outline-light me-2">
                        <i class="fas fa-shopping-cart"></i> Корзина
                    </a>
                    <div id="auth-buttons"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container py-4">
            <h1 class="mb-4">Результаты поиска</h1>
            <div id="search-query" class="mb-3"></div>
            <div class="row" id="search-results"></div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2025 GAMING STORE. Все права защищены.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function displaySearchResults() {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            const queryDiv = document.getElementById('search-query');
            const container = document.getElementById('search-results');
            
            if (!query) {
                queryDiv.innerHTML = '<div class="alert alert-warning">Введите поисковый запрос</div>';
                container.innerHTML = '';
                return;
            }
            
            const games = searchGames(query);
            queryDiv.innerHTML = `<p>Результаты для: "<strong>${query}</strong>"</p>`;
            
            if (games.length === 0) {
                container.innerHTML = '<div class="alert alert-info">Игры не найдены</div>';
                return;
            }
            
            container.innerHTML = games.map(game => `
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">${game.title}</h5>
                            <p class="card-text">${game.description}</p>
                            <p><strong>Цена: ${game.price} RUB</strong></p>
                            <p>Продавец: ${game.seller.login} (Рейтинг: ${game.seller.rating})</p>
                            <button class="btn btn-primary add-to-cart" data-game-id="${game.id}">В корзину</button>
                            <a href="game-detail.html?id=${game.id}" class="btn btn-outline-secondary">Подробнее</a>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', () => {
                    const gameId = parseInt(btn.dataset.gameId);
                    const game = games.find(g => g.id === gameId);
                    cart.addItem(game);
                });
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            displaySearchResults();
            cart.updateCartCount();
        });
    </script>
</body>
</html>
